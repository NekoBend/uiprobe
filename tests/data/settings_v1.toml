[confirm]
# Labels of buttons that confirm what the screen asks.
words = [
    "OK",
    "はい",
    "確認",
    "確定",
    "続ける",
    "続行",
    "同意",
    "許可",
    "実行",
    "適用",
    "完了",
    "yes",
    "confirm",
    "continue",
    "proceed",
    "accept",
    "agree",
    "allow",
    "apply",
    "done",
]
remove = []

[rules]
tap_unlabeled = false
skip_number_only = true
skip_toggles = true
refuse_dialog_confirm = true
min_visible_px = 8
edge_top_px = 24
edge_bottom_px = 32
edge_side_px = 30

[limits]
depth = 5
actions = 300
minutes = 30

[keys]
# Keys that act on the whole device; `uiprobe key` refuses them.
refuse = [
    "KEYCODE_ACCESSIBILITY",
    "KEYCODE_ALL_APPS",
    "KEYCODE_ASSIST",
    "KEYCODE_AVR_INPUT",
    "KEYCODE_BOOKMARK",
    "KEYCODE_BRIGHTNESS_DOWN",
    "KEYCODE_BRIGHTNESS_UP",
    "KEYCODE_CALCULATOR",
    "KEYCODE_CALENDAR",
    "KEYCODE_CAMERA",
    "KEYCODE_CONTACTS",
    "KEYCODE_CONTEXTUAL_INSERT",
    "KEYCODE_CONTEXTUAL_QUERY",
    "KEYCODE_CONTEXTUAL_SEARCH",
    "KEYCODE_DICTATE",
    "KEYCODE_DO_NOT_DISTURB",
    "KEYCODE_DVR",
    "KEYCODE_EMOJI_PICKER",
    "KEYCODE_ENVELOPE",
    "KEYCODE_EXPLORER",
    "KEYCODE_FOCUS",
    "KEYCODE_GUIDE",
    "KEYCODE_KEYBOARD_BACKLIGHT_DOWN",
    "KEYCODE_KEYBOARD_BACKLIGHT_TOGGLE",
    "KEYCODE_KEYBOARD_BACKLIGHT_UP",
    "KEYCODE_LANGUAGE_SWITCH",
    "KEYCODE_MANNER_MODE",
    "KEYCODE_META_LEFT",
    "KEYCODE_META_RIGHT",
    "KEYCODE_MUSIC",
    "KEYCODE_MUTE",
    "KEYCODE_NOTIFICATION",
    "KEYCODE_PAIRING",
    "KEYCODE_PROFILE_SWITCH",
    "KEYCODE_RECENT_APPS",
    "KEYCODE_SCREENSHOT",
